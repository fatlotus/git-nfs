[package]
name = "git-nfs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
nfsserve = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
flate2 = "1.0"
sha1 = "0.10"
hex = "0.4"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
anyhow = "1.0"
libc = "0.2"
lru = "0.12"
tempfile = "3"
google-cloud-storage = { version = "1.18.0", features = ["unstable-stream"] }
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
async-recursion = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
